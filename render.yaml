services:
  - type: web
    name: drivesync-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DDL_AUTO
        value: update
      - key: SEED_DEMO_DATA
        value: "false"
      - key: NOTIFICATION_TEST_MODE
        value: "true"
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: SMS_NOTIFICATIONS_ENABLED
        value: "false"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
